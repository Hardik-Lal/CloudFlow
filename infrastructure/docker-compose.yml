name: cloudflow

# Every service: no privilege escalation (setuid) and bounded memory/CPU.
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    <<: *hardening
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cloudflow}
      POSTGRES_USER: ${POSTGRES_USER:-cloudflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [platform]

  registry:
    <<: *hardening
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    # Stores images built by the deployment engine (tagged localhost:5000/<org>/<project>:<tag>).
    image: registry:3
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REGISTRY_PORT:-5000}:5000"
    volumes:
      - registry-data:/var/lib/registry
    networks: [platform, cluster]

  # S3-compatible artifact storage for local use (SeaweedFS). In AWS, point the backend at an S3
  # bucket instead (see docs/deployment.md) and leave this service out.
  object-storage:
    <<: *hardening
    image: chrislusf/seaweedfs:4.47
    restart: unless-stopped
    environment:
      S3_ACCESS_KEY: ${CLOUDFLOW_S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${CLOUDFLOW_S3_SECRET_KEY:-}
    # One identity with the configured keys; anonymous access is denied. The bucket is created on
    # startup.
    entrypoint: ["sh", "-c"]
    command:
      - >-
        if [ -z "$$S3_ACCESS_KEY" ] || [ -z "$$S3_SECRET_KEY" ]; then
        echo "CLOUDFLOW_S3_ACCESS_KEY and CLOUDFLOW_S3_SECRET_KEY must be set" >&2; exit 1; fi;
        printf '{"identities":[{"name":"cloudflow","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List"]}]}'
        "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json
        && exec weed mini -dir=/data -s3.config=/tmp/s3.json -bucket=${CLOUDFLOW_S3_BUCKET:-cloudflow-artifacts}
    volumes:
      - object-storage-data:/data
    networks: [platform]
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  backend:
    <<: *hardening
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "2.0"
    build: ../backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      registry:
        condition: service_started
    # The deployment engine drives the host's Docker Engine. The backend runs as a non-root user
    # and gets socket access through this supplementary group (the socket's group id).
    group_add:
      - "${DOCKER_SOCKET_GID:-0}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Written by the k3s service (profile "kubernetes"); empty otherwise.
      - k3s-kubeconfig:/etc/cloudflow/kube:ro
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cloudflow}
      DATABASE_USERNAME: ${POSTGRES_USER:-cloudflow}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?GITHUB_CLIENT_ID must be set}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?GITHUB_CLIENT_SECRET must be set}
      CLOUDFLOW_JWT_SECRET: ${CLOUDFLOW_JWT_SECRET:?CLOUDFLOW_JWT_SECRET must be set}
      CLOUDFLOW_ENCRYPTION_KEY: ${CLOUDFLOW_ENCRYPTION_KEY:?CLOUDFLOW_ENCRYPTION_KEY must be set}
      CLOUDFLOW_COOKIE_SECURE: ${CLOUDFLOW_COOKIE_SECURE:-false}
      # Image names are resolved by the Docker daemon on the host, where the registry is published.
      CLOUDFLOW_REGISTRY: localhost:${REGISTRY_PORT:-5000}
      CLOUDFLOW_PUBLIC_HOST: ${CLOUDFLOW_PUBLIC_HOST:-localhost}
      # CI/CD: URL GitHub Actions uses to reach this API, and the optional webhook secret.
      CLOUDFLOW_PUBLIC_API_URL: ${PUBLIC_API_BASE_URL:-http://localhost:8080}
      CLOUDFLOW_GITHUB_WEBHOOK_SECRET: ${CLOUDFLOW_GITHUB_WEBHOOK_SECRET:-}
      CLOUDFLOW_AI_BASE_URL: http://ai-service:8000
      CLOUDFLOW_AI_INTERNAL_TOKEN: ${CLOUDFLOW_AI_INTERNAL_TOKEN}
      # Phase 9: Trivy image scanning and API rate limiting.
      CLOUDFLOW_SECURITY_SCAN_ENABLED: ${CLOUDFLOW_SCAN_ENABLED:-true}
      CLOUDFLOW_SECURITY_SCAN_BLOCKONCRITICAL: ${CLOUDFLOW_SCAN_BLOCK_ON_CRITICAL:-false}
      CLOUDFLOW_RATELIMIT_ENABLED: ${CLOUDFLOW_RATE_LIMIT_ENABLED:-true}
      # Phase 10: artifact storage (S3 or S3-compatible).
      CLOUDFLOW_STORAGE_ENABLED: ${CLOUDFLOW_STORAGE_ENABLED:-true}
      CLOUDFLOW_STORAGE_BUCKET: ${CLOUDFLOW_S3_BUCKET:-cloudflow-artifacts}
      CLOUDFLOW_STORAGE_REGION: ${CLOUDFLOW_S3_REGION:-us-east-1}
      CLOUDFLOW_STORAGE_ENDPOINT: ${CLOUDFLOW_S3_ENDPOINT-http://object-storage:8333}
      CLOUDFLOW_STORAGE_PATHSTYLEACCESS: ${CLOUDFLOW_S3_PATH_STYLE:-true}
      CLOUDFLOW_STORAGE_ACCESSKEY: ${CLOUDFLOW_S3_ACCESS_KEY:-}
      CLOUDFLOW_STORAGE_SECRETKEY: ${CLOUDFLOW_S3_SECRET_KEY:-}
      # Phase 10: Kubernetes deployment target (start the "kubernetes" profile and set this to true).
      CLOUDFLOW_KUBERNETES_ENABLED: ${CLOUDFLOW_KUBERNETES_ENABLED:-false}
      CLOUDFLOW_KUBERNETES_KUBECONFIG: /etc/cloudflow/kube/kubeconfig.yaml
      CLOUDFLOW_KUBERNETES_MASTERURL: https://k3s:6443
      CLOUDFLOW_KUBERNETES_NODEHOST: k3s
      CLOUDFLOW_KUBERNETES_PUBLICHOST: ${CLOUDFLOW_PUBLIC_HOST:-localhost}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    # The backend joins the application network to health-check deployed containers by name.
    networks: [platform, apps]

  ai-service:
    <<: *hardening
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"
    build: ../ai-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AI_SERVICE_ENVIRONMENT: ${CLOUDFLOW_ENVIRONMENT:-local}
      AI_SERVICE_DATABASE_URL: postgresql://${POSTGRES_USER:-cloudflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cloudflow}
      AI_SERVICE_INTERNAL_TOKEN: ${CLOUDFLOW_AI_INTERNAL_TOKEN:?CLOUDFLOW_AI_INTERNAL_TOKEN must be set}
      # Without a key the platform runs normally and only AI features report that AI is off.
      AI_SERVICE_OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_SERVICE_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-5.4-mini}
      AI_SERVICE_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
    # Internal only: reachable by the backend over the platform network, never published to the host.
    expose:
      - "8000"
    networks: [platform]

  prometheus:
    <<: *hardening
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
    image: prom/prometheus:v3.14.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    networks: [platform]

  # Optional: docker compose --profile grafana up -d
  grafana:
    <<: *hardening
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    image: grafana/grafana:13.2.2
    profiles: [grafana]
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    networks: [platform]

  frontend:
    <<: *hardening
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:8080}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks: [platform]

  # Optional local Kubernetes cluster for the Kubernetes deployment target:
  #   docker compose --profile kubernetes up -d   (and CLOUDFLOW_KUBERNETES_ENABLED=true)
  # k3s needs a privileged container; use it for local development only.
  k3s:
    profiles: [kubernetes]
    image: rancher/k3s:v1.37.0-k3s1
    command:
      - server
      - --disable=traefik
      - --tls-san=k3s
      - --service-node-port-range=30000-30049
      - --write-kubeconfig-mode=644
    privileged: true
    restart: unless-stopped
    environment:
      K3S_KUBECONFIG_OUTPUT: /output/kubeconfig.yaml
    tmpfs:
      - /run
      - /var/run
    volumes:
      - k3s-data:/var/lib/rancher/k3s
      - k3s-kubeconfig:/output
      - ./k3s/registries.yaml:/etc/rancher/k3s/registries.yaml:ro
    ports:
      # NodePorts of applications deployed to Kubernetes.
      - "127.0.0.1:30000-30049:30000-30049"
    # "apps" lets the backend reach the API server and NodePorts; "cluster" reaches the registry.
    networks: [apps, cluster]
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"

volumes:
  postgres-data:
  registry-data:
  prometheus-data:
  grafana-data:
  k3s-data:
  object-storage-data:
  k3s-kubeconfig:

networks:
  platform:
    name: cloudflow-platform
  # Deployed applications run here, isolated from the database and the AI service.
  apps:
    name: cloudflow-apps
  # The local Kubernetes cluster pulls images from the registry over this network.
  cluster:
    name: cloudflow-cluster
