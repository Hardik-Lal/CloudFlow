name: End-to-end tests

# Builds and starts the full stack, then runs the Playwright suite against it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Configure the stack
        working-directory: infrastructure
        run: |
          cp .env.example .env
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "CLOUDFLOW_JWT_SECRET=$(openssl rand -base64 32)"
            echo "CLOUDFLOW_ENCRYPTION_KEY=$(openssl rand -base64 32)"
            echo "CLOUDFLOW_AI_INTERNAL_TOKEN=$(openssl rand -hex 32)"
            # The E2E suite checks the OAuth redirect but never completes a GitHub login, so a
            # CI-only client id is enough; GitHub itself is not contacted.
            echo "GITHUB_CLIENT_ID=cloudflow-ci"
            echo "GITHUB_CLIENT_SECRET=cloudflow-ci"
            echo "DOCKER_SOCKET_GID=$(stat -c %g /var/run/docker.sock)"
            echo "CLOUDFLOW_S3_ACCESS_KEY=$(openssl rand -hex 16)"
            echo "CLOUDFLOW_S3_SECRET_KEY=$(openssl rand -hex 32)"
          } >> .env
          # Later assignments win: drop the empty defaults from the example.
          sed -i -E '/^(POSTGRES_PASSWORD=change-me|CLOUDFLOW_JWT_SECRET=|CLOUDFLOW_ENCRYPTION_KEY=|CLOUDFLOW_AI_INTERNAL_TOKEN=|GITHUB_CLIENT_ID=|GITHUB_CLIENT_SECRET=|DOCKER_SOCKET_GID=0|CLOUDFLOW_S3_ACCESS_KEY=|CLOUDFLOW_S3_SECRET_KEY=)$/d' .env

      - name: Start CloudFlow
        working-directory: infrastructure
        run: |
          docker compose up -d --build --wait --wait-timeout 300

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies and browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_API_URL: http://localhost:8080
        run: npm run e2e

      - name: Stack logs
        if: failure()
        working-directory: infrastructure
        run: docker compose logs --no-color --tail=300

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
